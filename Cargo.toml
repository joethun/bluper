[workspace]
resolver = "2"
members = [
    "rust/crates/editor-core",
    "rust/crates/time",
    "rust/crates/bridge",
    "rust/crates/effects",
    "rust/crates/gpu",
    "rust/crates/masks",
    "rust/wasm",
    "rust/crates/compositor",
    "apps/desktop/src-tauri",
]

# Cargo ignores a `[profile]` in a non-root manifest, so these have to live here
# to take effect at all — the desktop shell declared them and was silently
# getting the default release profile instead.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
# The Rust side is the hot path — per-frame GPU command encoding, mask SDF
# generation, effect passes and frame-rate arithmetic — and this build is
# only ever installed, never downloaded, so there is no transfer size to
# trade speed against. `lto` and `strip` keep the binary reasonable.
opt-level = 3
strip = true
